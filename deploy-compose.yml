services:
  api:
    # Built from this checkout rather than pulled from the upstream registry:
    # the PindyChat name, the login wordmark, the icons and the provider
    # web-search indicator all live in the source now, so a pre-built image
    # would ship none of them. `Dockerfile.multi` is the staged build the
    # upstream images come from — packages and client compile in parallel
    # stages and only production dependencies land in the runtime layer.
    # Layers cache on `package*.json`, so a source-only change rebuilds in
    # minutes and a no-op `up --build` in seconds.
    build:
      context: .
      dockerfile: Dockerfile.multi
      args:
        # Surfaced in Settings -> About for support triage. Optional: pass them
        # through the environment when building, e.g.
        #   BUILD_COMMIT=$(git rev-parse --short HEAD) npm run start:deployed
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_BRANCH: ${BUILD_BRANCH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        # Heap ceiling for the client build, which is the memory peak of the
        # whole image. Upstream's 6144 assumes a build host with the RAM to
        # match; on a small VPS it lets Node grow past physical memory and get
        # OOM-killed instead of collecting garbage, so lower it to fit the box:
        #   NODE_MAX_OLD_SPACE_SIZE=2560 npm run start:deployed
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-6144}
        # `npm ci` wall-clock budget per attempt. The 1500s default is generous
        # on a normal builder but a single-core host can exceed it.
        NPM_CI_TIMEOUT_SECONDS: ${NPM_CI_TIMEOUT_SECONDS:-1500}
    container_name: PindyChat-API
    #ports:
     # - 3080:3080
    depends_on:
      - mongodb
      - rag_api
    restart: always
    extra_hosts:
    - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://admin.localhost}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      # Deliberately no bind mount over `client/public/assets`. The client build
      # runs `copyPublicAssets()` (client/vite.config.ts), which folds
      # `public/assets` into `dist/assets`, and `api/server/index.js` serves
      # `paths.dist` ahead of `paths.assets` — so the logo, favicons and endpoint
      # icons are answered from the built bundle and a mount here would sit
      # behind it, looking like an override while changing nothing. Swap the mark
      # by editing `client/public/assets`, regenerating the PNGs with
      # `client/scripts/generate-icons.mjs`, and rebuilding.
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./skill:/app/skill
      - librechat-data:/app/data

  admin-panel:
    image: registry.librechat.ai/librechat-ai/librechat-admin-panel:latest
    container_name: admin-panel
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  client:
    image: nginx:1.27.0-alpine
    container_name: PindyChat-NGINX
    ports:
      - 3080:443
    depends_on:
      - api
      - admin-panel
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/chat.pindyyogurt.store/privkey.pem:/etc/letsencrypt/live/chat.pindyyogurt.store/privkey.pem
      - /etc/letsencrypt/live/chat.pindyyogurt.store/fullchain.pem:/etc/letsencrypt/live/chat.pindyyogurt.store/fullchain.pem
      - /etc/letsencrypt/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf
  mongodb:
    container_name: chat-mongodb
    # ports:  # Uncomment this to access mongodb from outside docker, not safe in deployment
    #   - 27018:27017
    image: mongo:8.0.20
    restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  pgdata2:
  librechat-data:
